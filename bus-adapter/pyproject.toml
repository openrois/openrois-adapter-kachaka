[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrois-bus-kachaka"
version = "0.1.0a1"
description = "OpenRoIS BusAdapter implementation for the Kachaka robot (gRPC)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "OpenRoIS Community" },
]
keywords = ["rois", "omg", "robotics", "kachaka", "bus-adapter", "grpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openrois-interfaces>=0.1.0a2",
    "kachaka-api>=3.10",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["openrois_bus_kachaka"]
force-include = { "openrois_bus_kachaka/py.typed" = "openrois_bus_kachaka/py.typed" }

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["openrois_bus_kachaka"]

[[tool.mypy.overrides]]
module = "kachaka_api.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]